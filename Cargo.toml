[package]
name = "AI_TD"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
bevy = { version = "0.20", features = ["jpeg"] }

[features]
tracy = ["bevy/trace_tracy"]

# Debug builds: optimise our own code a little and all dependencies (Bevy, wgpu, etc.) fully.
# Keeps `cargo run` fast at runtime while retaining debug info and fast incremental builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
